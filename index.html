<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>rps</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff; --text: #333; --border: #eeeeee; --grid-line: #f2f2f2;
            --status-red: #ff5f57; --status-green: #28c840;
            --ink: #222;
            --highlight: #ff3b30;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        html, body { height: 100%; }
        body {
            margin: 0; padding: 20px 20px 30px; font-family: 'Roboto', sans-serif; font-weight: 100;
            background: var(--bg); color: var(--text);
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; touch-action: none;
            -webkit-user-select: none; user-select: none;
        }

        #status-bar { position: fixed; top: 15px; left: 15px; display: flex; gap: 8px; align-items: center; z-index: 100; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #eee; }

        #sound-toggle {
            width: 16px; height: 16px;
            cursor: pointer;
            color: #ccc;
            display: flex; align-items: center; justify-content: center;
            margin-left: 4px;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
            transform-origin: center;
        }
        #sound-toggle:hover { color: #888; }
        #sound-toggle.on { color: var(--ink); }
        #sound-toggle.pulse {
            animation: sound-pulse 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
            color: var(--highlight);
        }
        @keyframes sound-pulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(3); }
            100% { transform: scale(1); }
        }
        #sound-toggle svg { width: 100%; height: 100%; display: block; }

        #player-count {
            position: fixed; top: 13px; right: 15px; z-index: 100;
            font-size: 0.8rem; font-weight: 300; color: #bbb; letter-spacing: 1px;
        }

        #identity {
            margin-top: 10px;
            font-size: 1.4rem; font-weight: 100; letter-spacing: 1px;
            color: var(--ink);
            text-align: center;
            min-height: 1.8rem;
        }
        #identity .name { font-weight: 300; }

        #stage {
            flex: 1;
            width: 100%;
            display: flex; align-items: center; justify-content: center;
            margin: 10px 0;
            position: relative;
            min-height: 0;
        }
        #grid-wrap {
            position: relative;
            width: min(75vw, 65vh);
            height: min(75vw, 65vh);
            border: 1px solid var(--border);
            background: white;
        }
        #grid-svg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block;
            cursor: crosshair;
        }
        #grid-wrap.playing { cursor: none; }
        #grid-wrap.playing #grid-svg { cursor: none; }

        #arena-announce {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 8%;
            color: var(--highlight);
            font-family: 'Roboto', sans-serif;
            font-weight: 100;
            letter-spacing: 2px;
            font-size: clamp(1.2rem, 4vmin, 2.4rem);
            pointer-events: none;
            opacity: 0;
            line-height: 1.2;
        }
        #arena-announce.show {
            animation: arena-flash 1.4s cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        @keyframes arena-flash {
            0%   { opacity: 0; transform: scale(0.9); }
            15%  { opacity: 1; transform: scale(1); }
            70%  { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }

        .grid-line { stroke: var(--grid-line); stroke-width: 0.5; vector-effect: non-scaling-stroke; }
        .grid-frame { stroke: var(--border); stroke-width: 1; vector-effect: non-scaling-stroke; fill: none; }

        .char {
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            fill: var(--highlight);
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
        }
        .char.me { font-weight: 700; }
        .char.bot { fill: var(--highlight); opacity: 0.55; font-style: italic; }

        #footer {
            width: 100%; max-width: 600px;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding-bottom: 0;
            flex-shrink: 0;
        }
        #scoreboard {
            display: flex; gap: 40px;
            font-weight: 100; letter-spacing: 2px;
            color: var(--ink);
        }
        .score { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .score .label { font-size: 0.75rem; color: #aaa; letter-spacing: 3px; }
        .score .value {
            font-size: 1.6rem; font-weight: 100;
            display: inline-block;
            transform-origin: center;
            color: var(--ink);
        }
        .score .value.pulse {
            animation: score-pulse 0.5s cubic-bezier(0.2, 0.8, 0.4, 1);
        }
        @keyframes score-pulse {
            0%   { transform: scale(1); }
            40%  { transform: scale(3); }
            100% { transform: scale(1); }
        }

        #action-btn {
            font-family: 'Roboto', sans-serif; font-weight: 300;
            font-size: 1rem; letter-spacing: 4px;
            color: var(--ink);
            background: white;
            border: 1px solid #ddd;
            border-radius: 999px;
            padding: 10px 28px;
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease;
            white-space: nowrap;
            max-width: 90vw;
        }
        #action-btn:hover { border-color: #999; }
        #action-btn.playing { color: #aaa; }
        #action-btn.invite {
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            white-space: normal;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="status-bar">
        <div id="dot-net" class="dot"></div>
        <div id="dot-local" class="dot"></div>
        <div id="sound-toggle" title="Sound off — click to enable">
            <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                <path id="sound-icon-shape" d="M3 6 L3 10 L6 10 L9 13 L9 3 L6 6 Z" fill="currentColor" stroke="none"/>
                <line id="sound-x1" x1="11" y1="6" x2="14" y2="10" stroke="currentColor" stroke-width="1.2"/>
                <line id="sound-x2" x1="11" y1="10" x2="14" y2="6" stroke="currentColor" stroke-width="1.2"/>
                <path id="sound-wave1" d="M11 6 Q13 8 11 10" fill="none" stroke="currentColor" stroke-width="1.2" style="display:none"/>
                <path id="sound-wave2" d="M12.5 4.5 Q15.5 8 12.5 11.5" fill="none" stroke="currentColor" stroke-width="1.2" style="display:none"/>
            </svg>
        </div>
    </div>
    <div id="player-count">0</div>

    <div id="identity">You are team <span class="name" id="my-name">…</span></div>

    <div id="stage">
        <div id="grid-wrap">
            <svg id="grid-svg" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="arena-announce"></div>
        </div>
    </div>

    <div id="footer">
        <div id="scoreboard">
            <div class="score"><div class="label">R</div><div class="value" id="score-R">0</div></div>
            <div class="score"><div class="label">P</div><div class="value" id="score-P">0</div></div>
            <div class="score"><div class="label">S</div><div class="value" id="score-S">0</div></div>
        </div>
        <button id="action-btn" class="invite">Play with real humans: Click to copy URL to clipboard</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <script>
        // ===== Firebase (RPSforever Spark project) =====
        // REPLACE THESE VALUES WITH YOUR NEW RPSforever CONFIG FROM THE FIREBASE CONSOLE
        const firebaseConfig = {
          apiKey: "AIzaSyDCev1bJXI0jGqKvMzrXnSRcZKEwQhRP8s",
          authDomain: "rpsforever.firebaseapp.com",
          databaseURL: "https://rpsforever-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "rpsforever",
          storageBucket: "rpsforever.firebasestorage.app",
          messagingSenderId: "577664413632",
          appId: "1:577664413632:web:0efa4b3ab683399a8e6225"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // ===== Tunables =====
        const GRID_RESOLUTION = 100;
        const VIEWBOX = 1000;
        const CELL = VIEWBOX / GRID_RESOLUTION;
        const WRITE_INTERVAL_MS = 25;
        const STALE_MS = 15000;
        const PRUNE_MS = 60000;
        const POINTER_OFFSET_CELLS = 3;
        // Bots: Pong-style movement (vector + velocity, bouncing off walls).
        // Multiple bots can exist; each gets the player +1 every kill.
        const BOT_TICK_MS = 50;              // how often the owner advances bots
        const BOT_SPEED_CELLS_PER_TICK = 1.5; // base speed (per BOT_TICK_MS)
        const BOT_MAX_COUNT = 20;            // safety cap
        const BOT_OWNER_TIMEOUT_MS = 4000;   // re-claim ownership if heartbeat stale
        const BOT_KILL_REPLACEMENT_COUNT = 2; // bots spawned per bot kill (escalation)
        const ICON_PATHS = { R: 'rock.png', P: 'paper.png', S: 'scissors.png' };
        // Visual size of a character in grid cells (big & bold like weja).
        // Future SVG icons will be sized to this too.
        const CHAR_SIZE_CELLS = 8;
        // Collision: circular distance check between character centers.
        // CHAR_SIZE_CELLS = 8 means each character is ~4 cells from center to edge.
        // Two characters touch when their centers are within (radius_a + radius_b) cells.
        // We add a small forgiveness margin so the game feels generous, not pixel-precise.
        const COLLISION_FORGIVENESS_CELLS = 1.5;
        const COLLISION_RADIUS_CELLS = CHAR_SIZE_CELLS / 2 + COLLISION_FORGIVENESS_CELLS;
        // Friction: how much the rendered position lags behind the target.
        // Higher = more drag. 0.35 gives a clearly visible trail without
        // feeling sluggish. Range: 0.05 (almost none) → 0.6 (heavy).
        const FRICTION = 0.35;
        // Score animation: scale to 200% + fade to transparent over this duration.
        const SCORE_ANIM_MS = 500;
        // Minimum grid distance away from death point when respawning, so a
        // got character doesn't re-appear right where they died.
        const MIN_RESPAWN_DIST_CELLS = Math.max(8, Math.floor(GRID_RESOLUTION / 8));
        // Brief invulnerability after respawn so a fresh player can't be
        // chain-killed by someone camping the spot. ~1.2s feels fair.
        const RESPAWN_GRACE_MS = 1200;

        // ===== State =====
        const myId = Math.random().toString(36).substr(2, 9);
        const joinedAt = Date.now();
        let myType = null;
        let myName = null;
        let isPlaying = false;
        let myX = Math.floor(GRID_RESOLUTION / 2);
        let myY = Math.floor(GRID_RESOLUTION / 2);
        let myVisualX = myX;
        let myVisualY = myY;
        let lastWrite = 0;
        let pendingWrite = false;
        let allPlayers = {};
        let bots = {};                // id -> {type, x, y, dx, dy, owner, spawnedAt, lastTick}
        let scores = { R: 0, P: 0, S: 0 };
        let currentButtonState = 'invite';  // 'invite' | 'copied'
        // Death animation pool: keyed by a unique anim id.
        // Each entry: { id, type, x, y, isBot, isMe, startedAt }
        // Renderer draws these for SCORE_ANIM_MS, scaling 1→2 and fading 1→0.
        const dyingChars = {};
        let myLastDeath = null;
        let lastBotKillPos = null;    // last cell where a bot was killed
        let respawnedAt = 0; // Date.now() when I last (re)spawned
        let lastActiveCount = 0; // tracks player count between updates so we can detect transitions
        let activeCountInitialized = false; // suppresses announcement on the very first listener fire
        const announcedPlayerIds = new Set(); // player IDs we've already announced (so respawns don't re-fire)
        let lastAnnouncedAt = 0;
        const ANNOUNCE_COOLDOWN_MS = 30000; // minimum gap between arena announcements

        const NAME_POOL = {
            R: ['Boulder','Pebble','Granite','Flint','Slate','Cobble','Quartz','Gravel','Stone','Basalt','Marble','Chalk'],
            P: ['Origami','Scroll','Letter','Folio','Parchment','Sheet','Page','Notebook','Memo','Card','Atlas','Leaf'],
            S: ['Shears','Snip','Trim','Clip','Crop','Cutter','Blade','Edge','Sliver','Chop','Slice','Nip']
        };

        // ===== DOM =====
        const dotNet = document.getElementById('dot-net');
        const dotLocal = document.getElementById('dot-local');
        const myNameEl = document.getElementById('my-name');
        const playerCountEl = document.getElementById('player-count');
        const gridWrap = document.getElementById('grid-wrap');
        const svg = document.getElementById('grid-svg');
        const actionBtn = document.getElementById('action-btn');
        const scoreEls = {
            R: document.getElementById('score-R'),
            P: document.getElementById('score-P'),
            S: document.getElementById('score-S')
        };

        svg.setAttribute('viewBox', `0 0 ${VIEWBOX} ${VIEWBOX}`);

        // ===== Build grid =====
        const gridLinesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svg.appendChild(gridLinesGroup);

        function buildGridLines() {
            const MAX_LINES = 20;
            const step = Math.max(1, Math.ceil(GRID_RESOLUTION / MAX_LINES));
            gridLinesGroup.innerHTML = '';
            for (let i = step; i < GRID_RESOLUTION; i += step) {
                const v = i * CELL;
                const h = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                h.setAttribute('x1', 0); h.setAttribute('x2', VIEWBOX);
                h.setAttribute('y1', v); h.setAttribute('y2', v);
                h.setAttribute('class', 'grid-line');
                gridLinesGroup.appendChild(h);

                const ve = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                ve.setAttribute('y1', 0); ve.setAttribute('y2', VIEWBOX);
                ve.setAttribute('x1', v); ve.setAttribute('x2', v);
                ve.setAttribute('class', 'grid-line');
                gridLinesGroup.appendChild(ve);
            }
            const frame = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            frame.setAttribute('x', 0); frame.setAttribute('y', 0);
            frame.setAttribute('width', VIEWBOX); frame.setAttribute('height', VIEWBOX);
            frame.setAttribute('class', 'grid-frame');
            gridLinesGroup.appendChild(frame);
        }
        buildGridLines();

        const charsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        svg.appendChild(charsGroup);

        db.ref(".info/connected").on("value", (snap) => {
            dotNet.style.background = snap.val() ? 'var(--status-green)' : 'var(--status-red)';
        });

        const playerRef = db.ref('players/' + myId);
        const playersRef = db.ref('players');
        const scoresRef = db.ref('scores');
        const botsRef = db.ref('bots');

        auth.signInAnonymously().catch(err => console.warn('Anon auth failed:', err));
        auth.onAuthStateChanged(() => { joinGame(); });

        function prune() {
            const cutoff = Date.now() - STALE_MS * 4;
            playersRef.once('value', (snap) => {
                snap.forEach(child => {
                    const p = child.val();
                    if (!p || !p.lastSeen || p.lastSeen < cutoff) child.ref.remove();
                });
            });
        }
        playerRef.onDisconnect().remove();
        setInterval(prune, PRUNE_MS);

        // ===== Team assignment =====
        function countActiveHumans(currentPlayers) {
            const counts = { R: 0, P: 0, S: 0, total: 0 };
            Object.values(currentPlayers || {}).forEach(p => {
                if (p && p.type && counts.hasOwnProperty(p.type)) {
                    counts[p.type]++;
                    counts.total++;
                }
            });
            return counts;
        }
        function assignTeam(currentPlayers) {
            const counts = countActiveHumans(currentPlayers);
            if (counts.total < 3) {
                const min = Math.min(counts.R, counts.P, counts.S);
                const candidates = ['R','P','S'].filter(t => counts[t] === min);
                return candidates[Math.floor(Math.random() * candidates.length)];
            }
            return ['R','P','S'][Math.floor(Math.random() * 3)];
        }
        function makeName(type) {
            const pool = NAME_POOL[type];
            const base = pool[Math.floor(Math.random() * pool.length)];
            const num = Math.floor(Math.random() * 90) + 10;
            return `${base}-${num}`;
        }

        function pickRespawn(awayFrom) {
            // Returns a corner of the grid (with a small inset so the character
            // isn't clipped against the edge). If we know where you died, pick
            // the corner furthest from it so you get a clear escape distance.
            const inset = Math.max(2, Math.floor(GRID_RESOLUTION / 25));
            const lo = inset;
            const hi = GRID_RESOLUTION - 1 - inset;
            const corners = [
                { x: lo, y: lo },
                { x: hi, y: lo },
                { x: lo, y: hi },
                { x: hi, y: hi }
            ];
            if (!awayFrom) {
                // Random corner on first spawn
                return corners[Math.floor(Math.random() * corners.length)];
            }
            // Pick corner with max distance from death point
            let best = corners[0];
            let bestDist = -1;
            for (const c of corners) {
                const dx = c.x - awayFrom.x, dy = c.y - awayFrom.y;
                const d = dx * dx + dy * dy;
                if (d > bestDist) { bestDist = d; best = c; }
            }
            return best;
        }

        function joinGame() {
            playersRef.once('value', (snap) => {
                const current = snap.val() || {};
                // In solo mode (no other humans present), keep the same type on respawn.
                // Bots are always spawned as BEATS[myType], so changing type after death
                // would leave the player facing unbeatable (or same-type) bots.
                // Only assign fresh on first join or when in multiplayer.
                const otherHumans = Object.values(current).filter(p => p && p.type).length;
                if (!myType || otherHumans > 0) {
                    myType = assignTeam(current);
                }
                myName = makeName(myType);
                const teamFull = { R: 'Rock', P: 'Paper', S: 'Scissors' }[myType];
                myNameEl.textContent = teamFull;
                const spawn = pickRespawn(myLastDeath);
                myX = spawn.x; myY = spawn.y;
                myVisualX = myX; myVisualY = myY;
                // Reset render-side smoothing source so the character visibly drifts
                // from the corner toward wherever the pointer is now (rather than
                // snapping straight to the finger).
                visualPos[myId] = { x: spawn.x, y: spawn.y };
                myLastDeath = null;
                respawnedAt = Date.now();
                playerRef.set({
                    name: myName,
                    type: myType,
                    x: myX,
                    y: myY,
                    active: false,
                    joinedAt: joinedAt,
                    spawnedAt: respawnedAt,
                    lastSeen: Date.now()
                });
            });
        }

        playersRef.on('value', (snap) => {
            const prev = allPlayers;
            const next = snap.val() || {};
            // Detect disappearances: anyone who was present + active in prev
            // but is now gone from next. We trust this represents a "got"
            // event and spawn a death animation locally so all clients see it.
            // (False positives — someone closing the tab — would also animate,
            // which is fine; it's just a small visual flourish.)
            const now = Date.now();
            for (const id in prev) {
                if (id === myId) continue; // local collision already spawned ours
                if (!next[id] && prev[id] && prev[id].type && prev[id].active
                    && (now - (prev[id].lastSeen || 0)) < STALE_MS) {
                    spawnDeath(id, prev[id].type, prev[id].x, prev[id].y, false, false);
                }
            }
            allPlayers = next;
            const activeCount = Object.values(allPlayers).filter(p => p && p.lastSeen && (now - p.lastSeen) < STALE_MS).length;
            playerCountEl.textContent = activeCount;

            // Detect when a genuinely new human joins while we were otherwise alone.
            // Track player IDs we've already announced so respawns (player gets
            // killed → record removed → record recreated under same id) don't re-fire.
            // Skip on the very first fire of this listener (we don't know yet
            // whether anyone is "new").
            if (activeCountInitialized && lastActiveCount <= 1 && activeCount >= 2) {
                const now2 = Date.now();
                let newcomerId = null;
                for (const id in next) {
                    if (id === myId) continue;
                    if (announcedPlayerIds.has(id)) continue;
                    const p = next[id];
                    if (p && p.lastSeen && (now2 - p.lastSeen) < STALE_MS) {
                        newcomerId = id;
                        break;
                    }
                }
                if (newcomerId && (now2 - lastAnnouncedAt) > ANNOUNCE_COOLDOWN_MS) {
                    announcedPlayerIds.add(newcomerId);
                    lastAnnouncedAt = now2;
                    showArenaAnnouncement('A real human has entered the arena');
                } else if (newcomerId) {
                    // Still record this id so we don't re-announce them later
                    announcedPlayerIds.add(newcomerId);
                }
            }
            // Also: any active player we've never seen is now known.
            // Prevents announcing them later if they happen to be present
            // during a transition.
            for (const id in next) {
                if (id !== myId) announcedPlayerIds.add(id);
            }
            lastActiveCount = activeCount;
            activeCountInitialized = true;

            updateGameMode(activeCount);
            maybeInitialBotWipe();
        });

        function isSoloMode() {
            // Solo/bot mode: I'm the only active human (others are bots).
            return getActivePlayerIds().length <= 1;
        }

        function updateGameMode(activeCount) {
            // The game is always running — no start/stop. Just ensure we're active
            // and that the button shows the permanent invite prompt.
            if (!myType) return;
            if (!isPlaying) {
                isPlaying = true;
                playerRef.update({ active: true, lastSeen: Date.now() });
                dotLocal.style.background = 'var(--status-green)';
            }
            // Keep the invite button up unless mid "copied" confirmation.
            if (currentButtonState !== 'copied') {
                setButton('invite');
            }
        }

        // ===== Multi-bot listener =====
        // Track per-bot state and detect disappearances for death animation.
        const prevBots = {};
        // Set of bot IDs being removed for housekeeping (corrupt, multiplayer
        // cleanup, etc.) — suppress death animation for these.
        const silentBotRemovals = new Set();

        botsRef.on('value', (snap) => {
            const next = snap.val() || {};
            // Detect removed bots → spawn death anim where they were,
            // unless the removal was housekeeping.
            for (const id in prevBots) {
                if (!next[id] && prevBots[id] && prevBots[id].type) {
                    if (silentBotRemovals.has(id)) {
                        silentBotRemovals.delete(id);
                    } else {
                        spawnDeath('bot-' + id, prevBots[id].type, prevBots[id].x, prevBots[id].y, true, false);
                    }
                }
            }
            bots = next;
            for (const k in prevBots) delete prevBots[k];
            for (const k in next) prevBots[k] = next[k];
            maybeInitialBotWipe();
        });

        playerRef.on('value', (snap) => {
            const me = snap.val();
            if (!me && myType) {
                // I was removed (got got). Rejoin — updateGameMode will set me
                // active again automatically on the next players snapshot.
                isPlaying = false;
                joinGame();
            }
        });

        function pulseScore(el) {
            el.classList.remove('pulse');
            void el.offsetWidth; // force reflow to restart animation
            el.classList.add('pulse');
        }
        Object.values(scoreEls).forEach(el => {
            el.addEventListener('animationend', () => el.classList.remove('pulse'));
        });

        scoresRef.on('value', (snap) => {
            const next = snap.val() || { R: 0, P: 0, S: 0 };
            ['R', 'P', 'S'].forEach(t => {
                const prevVal = scores[t] || 0;
                const nextVal = next[t] || 0;
                scoreEls[t].textContent = nextVal;
                if (nextVal > prevVal) pulseScore(scoreEls[t]);
            });
            scores = next;
        });

        // ===== Bot management =====
        // Architecture:
        // - Bots are stored at /bots/{id}, each with {type, x, y, dx, dy, owner, spawnedAt, lastTick}
        // - Each bot has an "owner" — one client responsible for advancing its position.
        // - Owner runs a tick loop, updating x/y via Pong-style velocity + wall bounce.
        // - If an owner goes stale (lastTick > BOT_OWNER_TIMEOUT_MS old), another client claims it.
        // - Leader-election for SPAWNING new bots: the lowest-id active player is the leader
        //   and is responsible for ensuring at least one bot exists when alone.
        // - When a player kills a bot, that player spawns 2 replacement bots immediately.

        const BEATS = { R: 'S', S: 'P', P: 'R' };

        function getActivePlayerIds() {
            const now = Date.now();
            return Object.keys(allPlayers).filter(id => {
                const p = allPlayers[id];
                return p && p.lastSeen && (now - p.lastSeen) < STALE_MS;
            });
        }

        function isLeader() {
            // Deterministic leader: smallest player ID among active players.
            const ids = getActivePlayerIds().sort();
            return ids.length > 0 && ids[0] === myId;
        }

        function pickBotType() {
            // Bot should always be the type the current player beats.
            // (In solo mode all bots are this type; in multi-player there are no bots anyway.)
            if (myType && BEATS[myType]) return BEATS[myType];
            return ['R','P','S'][Math.floor(Math.random() * 3)];
        }

        function randomBotVelocity() {
            // Random direction with speed BOT_SPEED_CELLS_PER_TICK
            const angle = Math.random() * Math.PI * 2;
            return {
                dx: Math.cos(angle) * BOT_SPEED_CELLS_PER_TICK,
                dy: Math.sin(angle) * BOT_SPEED_CELLS_PER_TICK
            };
        }

        function spawnBot(spawnPos, onComplete) {
            // Adds a new bot to the database, owned by me.
            const now = Date.now();
            const id = Math.random().toString(36).substr(2, 9);
            const v = randomBotVelocity();
            let sx, sy;
            if (spawnPos) {
                sx = spawnPos.x; sy = spawnPos.y;
            } else {
                // Random position with a slight inset from walls
                sx = 5 + Math.floor(Math.random() * (GRID_RESOLUTION - 10));
                sy = 5 + Math.floor(Math.random() * (GRID_RESOLUTION - 10));
            }
            botsRef.child(id).set({
                type: pickBotType(),
                x: sx,
                y: sy,
                dx: v.dx,
                dy: v.dy,
                owner: myId,
                spawnedAt: now,
                lastTick: now
            }, (err) => {
                if (err) console.error('Bot spawn failed (check DB rules for /bots):', err);
                if (onComplete) onComplete();
            });
        }

        // ===== Initial cleanup =====
        // On first load, if I become the only player (solo), wipe any leftover
        // bots from previous sessions. This prevents the "4 flashing letters
        // in corners" issue where ghost bots from a prior session briefly
        // appear before being cleaned up. The first manageBots tick will
        // then spawn a fresh bot.
        let didInitialBotWipe = false;
        function maybeInitialBotWipe() {
            if (didInitialBotWipe) return;
            if (!myType) return;
            const activeIds = getActivePlayerIds();
            if (activeIds.length !== 1 || activeIds[0] !== myId) return;
            didInitialBotWipe = true;
            // Mark all current bots for silent removal so we don't see their deaths
            for (const id in bots) silentBotRemovals.add(id);
            botsRef.remove();
        }

        // Periodic management: ensure correct number of bots exist (solo only),
        // claim ownership of any orphaned bots, drop ownership when multiplayer.
        // Also cleans up corrupted/stale bots from previous sessions.
        let spawnInFlight = false;

        function manageBots() {
            const now = Date.now();
            const activeIds = getActivePlayerIds();
            const alone = activeIds.length <= 1;
            const activeIdSet = new Set(activeIds);

            // Identify valid bots (those with proper schema fields).
            const validBots = {};
            const corruptBotIds = [];
            for (const id in bots) {
                const b = bots[id];
                if (b && typeof b.x === 'number' && typeof b.y === 'number'
                    && typeof b.dx === 'number' && typeof b.dy === 'number'
                    && !isNaN(b.x) && !isNaN(b.y) && !isNaN(b.dx) && !isNaN(b.dy)
                    && b.type) {
                    validBots[id] = b;
                } else {
                    corruptBotIds.push(id);
                }
            }
            // Remove corrupt bots (leftover from old schema or partial writes).
            // Only the leader does this so we don't all stampede.
            // Suppress death animation — these aren't kills, just cleanup.
            if (isLeader()) {
                for (const id of corruptBotIds) {
                    silentBotRemovals.add(id);
                    botsRef.child(id).remove();
                }
            }

            const botCount = Object.keys(validBots).length;

            if (!alone) {
                // Multiplayer: leader clears all bots. Silent — no death anims.
                if (isLeader() && botCount > 0) {
                    for (const id in validBots) silentBotRemovals.add(id);
                    botsRef.remove();
                }
                return;
            }

            // Solo: leader ensures exactly one bot to start. Use a flag so we
            // don't spawn multiple before the write propagates.
            if (alone && isLeader() && botCount === 0 && myType && !spawnInFlight) {
                spawnInFlight = true;
                spawnBot(lastBotKillPos, () => { spawnInFlight = false; });
            }

            // Claim orphaned bots: any bot whose owner is no longer active OR
            // whose owner heartbeat is stale becomes mine.
            for (const id in validBots) {
                const b = validBots[id];
                const ownerActive = activeIdSet.has(b.owner);
                const heartbeatStale = (now - (b.lastTick || 0)) > BOT_OWNER_TIMEOUT_MS;
                if (b.owner !== myId && (!ownerActive || heartbeatStale)) {
                    botsRef.child(id).update({ owner: myId, lastTick: now });
                }
            }
        }
        setInterval(manageBots, 1000);

        // Tick: advance all bots I own. Pong-style straight lines + wall bounce + bot-bot bounce.
        function tickBots() {
            const now = Date.now();
            // Snapshot local positions so we don't double-collide within one frame.
            const mine = {};
            for (const id in bots) {
                if (bots[id] && bots[id].owner === myId) mine[id] = { ...bots[id] };
            }
            if (Object.keys(mine).length === 0) return;

            // Compute next positions with wall bounce
            for (const id in mine) {
                const b = mine[id];
                let nx = b.x + b.dx;
                let ny = b.y + b.dy;
                let ndx = b.dx, ndy = b.dy;
                // Inset bounce so bots stay fully inside the grid
                const lo = 0, hi = GRID_RESOLUTION - 1;
                if (nx <= lo) { nx = lo; ndx = Math.abs(ndx); }
                else if (nx >= hi) { nx = hi; ndx = -Math.abs(ndx); }
                if (ny <= lo) { ny = lo; ndy = Math.abs(ndy); }
                else if (ny >= hi) { ny = hi; ndy = -Math.abs(ndy); }
                b._next = { x: nx, y: ny, dx: ndx, dy: ndy };
            }

            // Bot-bot collisions: any pair of bots that are about to occupy
            // close cells bounces off each other. Since we only own a subset,
            // we collide owned bots against ALL bots (including non-owned),
            // but only update owned ones.
            const collisionThreshold = COLLISION_RADIUS_CELLS * 2;
            const cThreshSq = collisionThreshold * collisionThreshold;
            for (const id in mine) {
                const a = mine[id];
                for (const otherId in bots) {
                    if (otherId === id) continue;
                    const o = bots[otherId];
                    if (!o) continue;
                    const ox = (mine[otherId] && mine[otherId]._next) ? mine[otherId]._next.x : o.x;
                    const oy = (mine[otherId] && mine[otherId]._next) ? mine[otherId]._next.y : o.y;
                    const ddx = a._next.x - ox;
                    const ddy = a._next.y - oy;
                    if (ddx * ddx + ddy * ddy < cThreshSq) {
                        // Elastic-ish bounce: reflect velocity along the collision axis.
                        const len = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                        const nx = ddx / len, ny = ddy / len;
                        // Reflect a's velocity over the normal
                        const vdot = a._next.dx * nx + a._next.dy * ny;
                        if (vdot < 0) {
                            a._next.dx = a._next.dx - 2 * vdot * nx;
                            a._next.dy = a._next.dy - 2 * vdot * ny;
                            // Nudge a out of overlap so they don't stick
                            a._next.x = ox + nx * collisionThreshold;
                            a._next.y = oy + ny * collisionThreshold;
                            // Re-clamp to grid bounds
                            a._next.x = Math.max(0, Math.min(GRID_RESOLUTION - 1, a._next.x));
                            a._next.y = Math.max(0, Math.min(GRID_RESOLUTION - 1, a._next.y));
                        }
                    }
                }
            }

            // Write back
            for (const id in mine) {
                const n = mine[id]._next;
                botsRef.child(id).update({
                    x: n.x, y: n.y, dx: n.dx, dy: n.dy,
                    lastTick: now, owner: myId
                });
            }
        }
        setInterval(tickBots, BOT_TICK_MS);

        // ===== Arena announcement =====
        // Big red Roboto-thin text overlay across the play area, flashes briefly.
        const arenaAnnounceEl = document.getElementById('arena-announce');
        function showArenaAnnouncement(text) {
            arenaAnnounceEl.textContent = text;
            // Re-trigger animation by removing and re-adding the class
            arenaAnnounceEl.classList.remove('show');
            void arenaAnnounceEl.offsetWidth;
            arenaAnnounceEl.classList.add('show');
        }
        arenaAnnounceEl.addEventListener('animationend', () => {
            arenaAnnounceEl.classList.remove('show');
        });

        // ===== Button (always the "invite humans / copy URL" control) =====
        // The game is always running; there is no start/stop. The button only
        // ever copies the URL so people can invite real humans.
        function setButton(state) {
            actionBtn.classList.add('invite');
            actionBtn.classList.remove('playing');
            if (state === 'copied') {
                actionBtn.textContent = 'URL copied to clipboard';
            } else {
                actionBtn.textContent = 'Play with real humans: Click to copy URL to clipboard';
            }
            currentButtonState = state;
        }
        actionBtn.addEventListener('click', () => {
            doCopy();
            setButton('copied');
            setTimeout(() => setButton('invite'), 1800);
        });

        function doCopy() {
            const url = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).catch(() => fallbackCopy(url));
            } else {
                fallbackCopy(url);
            }
        }
        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); } catch (e) {}
            document.body.removeChild(ta);
        }

        // ===== Pointer input =====
        function pointerToGrid(clientX, clientY) {
            const rect = gridWrap.getBoundingClientRect();
            const px = (clientX - rect.left) / rect.width;
            const py = (clientY - rect.top) / rect.height;
            const offsetFrac = POINTER_OFFSET_CELLS / GRID_RESOLUTION;
            const adjY = py - offsetFrac;
            const gx = Math.max(0, Math.min(GRID_RESOLUTION - 1, Math.floor(px * GRID_RESOLUTION)));
            const gy = Math.max(0, Math.min(GRID_RESOLUTION - 1, Math.floor(adjY * GRID_RESOLUTION)));
            const cx = Math.max(0, Math.min(GRID_RESOLUTION, px * GRID_RESOLUTION));
            const cy = Math.max(0, Math.min(GRID_RESOLUTION, adjY * GRID_RESOLUTION));
            const inside = px >= 0 && px <= 1 && py >= 0 && py <= 1;
            return { gx, gy, cx, cy, inside };
        }
        function handlePointer(clientX, clientY) {
            if (!isPlaying || !myType) return;
            const { gx, gy, cx, cy, inside } = pointerToGrid(clientX, clientY);
            if (!inside) return;
            myX = gx; myY = gy;
            myVisualX = cx; myVisualY = cy;
            scheduleWrite();
            checkCollision();
        }
        function scheduleWrite() {
            const now = Date.now();
            if (now - lastWrite >= WRITE_INTERVAL_MS) {
                doWrite();
            } else if (!pendingWrite) {
                pendingWrite = true;
                setTimeout(() => { pendingWrite = false; doWrite(); }, WRITE_INTERVAL_MS - (now - lastWrite));
            }
        }
        function doWrite() {
            lastWrite = Date.now();
            playerRef.update({ x: myX, y: myY, lastSeen: lastWrite, active: isPlaying });
        }
        gridWrap.addEventListener('pointermove', (e) => { handlePointer(e.clientX, e.clientY); });
        gridWrap.addEventListener('pointerdown', (e) => { handlePointer(e.clientX, e.clientY); });
        window.addEventListener('pointermove', (e) => {
            if (!isPlaying) return;
            const rect = gridWrap.getBoundingClientRect();
            const inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
            if (inside) handlePointer(e.clientX, e.clientY);
        });

        // ===== Collision =====
        let lastCollisionAt = 0;
        const recentDeaths = {}; // victimId -> timestamp; used to dedupe local + listener spawns

        function spawnDeath(victimId, type, x, y, isBot, isMe) {
            const now = Date.now();
            if (recentDeaths[victimId] && now - recentDeaths[victimId] < SCORE_ANIM_MS) return;
            recentDeaths[victimId] = now;
            const animId = victimId + ':' + now;
            dyingChars[animId] = {
                id: animId,
                type,
                x, y,
                isBot: !!isBot,
                isMe: !!isMe,
                startedAt: now
            };
            // Sound matches the LOSER's character — Rock got crunched, etc.
            playSound('got_' + type);
        }

        // Two characters collide when their centers are within the combined
        // collision radius. Since R/P/S all share the same size, the threshold
        // is 2 * COLLISION_RADIUS_CELLS. Distance is in grid units; works
        // identically whether GRID_RESOLUTION is 100 or 1024.
        function isHit(ax, ay, bx, by) {
            const dx = ax - bx, dy = ay - by;
            const threshold = COLLISION_RADIUS_CELLS * 2;
            return (dx * dx + dy * dy) <= (threshold * threshold);
        }

        function checkCollision() {
            if (!isPlaying) return;
            const now = Date.now();
            if (now - lastCollisionAt < 200) return;
            // Grace period after respawn: pointer moves don't kill or get killed.
            if (now - respawnedAt < RESPAWN_GRACE_MS) return;
            for (const id in allPlayers) {
                if (id === myId) continue;
                const p = allPlayers[id];
                if (!p || !p.active || !p.type) continue;
                if ((now - (p.lastSeen || 0)) > STALE_MS) continue;
                // Respect their respawn grace too — can't kill someone who just spawned.
                if (p.spawnedAt && (now - p.spawnedAt) < RESPAWN_GRACE_MS) continue;
                if (isHit(p.x, p.y, myX, myY)) {
                    if (p.type === myType) return;
                    if (BEATS[myType] === p.type) {
                        lastCollisionAt = now;
                        scoresRef.child(myType).transaction(v => (v || 0) + 1);
                        spawnDeath(id, p.type, p.x, p.y, false, false);
                        db.ref('players/' + id).remove();
                    } else {
                        lastCollisionAt = now;
                        scoresRef.child(p.type).transaction(v => (v || 0) + 1);
                        spawnDeath(myId, myType, myX, myY, false, true);
                        myLastDeath = { x: myX, y: myY };
                        playerRef.remove();
                    }
                    return;
                }
            }
            // Loop over all bots — collision with any bot the player beats
            // causes a kill + spawns BOT_KILL_REPLACEMENT_COUNT new bots.
            for (const bid in bots) {
                const b = bots[bid];
                if (!b || !b.type) continue;
                // Honor a brief invulnerability after spawn (player can't get killed by a fresh bot)
                if (b.spawnedAt && (now - b.spawnedAt) < RESPAWN_GRACE_MS) continue;
                if (!isHit(b.x, b.y, myX, myY)) continue;

                if (b.type === myType) continue;
                if (BEATS[myType] === b.type) {
                    // Player kills bot → score, remove this bot, spawn 2 new ones.
                    lastCollisionAt = now;
                    scoresRef.child(myType).transaction(v => (v || 0) + 1);
                    spawnDeath('bot-' + bid, b.type, b.x, b.y, true, false);
                    lastBotKillPos = { x: b.x, y: b.y };
                    botsRef.child(bid).remove();
                    // Spawn replacements at varied positions away from current player location.
                    // Respect safety cap so escalation doesn't run away.
                    const room = BOT_MAX_COUNT - Object.keys(bots).length;
                    const toSpawn = Math.max(0, Math.min(BOT_KILL_REPLACEMENT_COUNT, room));
                    for (let i = 0; i < toSpawn; i++) {
                        // Spread them around: opposite corner area + random scatter
                        const cornerX = (myX < GRID_RESOLUTION / 2) ? GRID_RESOLUTION - 10 : 10;
                        const cornerY = (myY < GRID_RESOLUTION / 2) ? GRID_RESOLUTION - 10 : 10;
                        const scatter = 15;
                        spawnBot({
                            x: Math.max(0, Math.min(GRID_RESOLUTION - 1,
                                cornerX + (Math.random() - 0.5) * scatter)),
                            y: Math.max(0, Math.min(GRID_RESOLUTION - 1,
                                cornerY + (Math.random() - 0.5) * scatter))
                        });
                    }
                    // Game keeps running — no invite prompt interruption, no stop.
                    return;
                } else {
                    // Player loses to this bot — respawn and keep playing.
                    lastCollisionAt = now;
                    scoresRef.child(b.type).transaction(v => (v || 0) + 1);
                    spawnDeath(myId, myType, myX, myY, false, true);
                    myLastDeath = { x: myX, y: myY };
                    isPlaying = false;
                    playerRef.remove();
                    return;
                }
            }
        }

        // ===== Rendering =====
        // Each character is a <g> node. Currently renders a <text> (R/P/S letter).
        // To swap in SVG icons later: set ICON_PATHS[type] to a URL, then update
        // renderCharContent() below to emit <image href="..."> instead of <text>.
        // CHAR_SIZE_CELLS controls visual size; it's defined in the tunables block.
        const visualPos = {};

        function renderCharContent(node, type, isMe, isBot) {
            // Clear any existing content
            while (node.firstChild) node.removeChild(node.firstChild);

            const sizePx = CHAR_SIZE_CELLS * CELL;
            const iconPath = ICON_PATHS[type];

            if (iconPath) {
                // Image icon mode (rock.png / paper.png / scissors.png)
                const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
                img.setAttributeNS('http://www.w3.org/1999/xlink', 'href', iconPath);
                img.setAttribute('href', iconPath);
                img.setAttribute('width', sizePx);
                img.setAttribute('height', sizePx);
                img.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                // Position via x/y offset (top-left); set in render loop
                img.dataset.role = 'icon';
                let cls = 'char';
                if (isMe) cls += ' me';
                if (isBot) cls += ' bot';
                img.setAttribute('class', cls);
                node.appendChild(img);
            } else {
                // Letter mode (current)
                const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                let cls = 'char';
                if (isMe) cls += ' me';
                if (isBot) cls += ' bot';
                t.setAttribute('class', cls);
                t.setAttribute('font-size', sizePx);
                t.textContent = type;
                t.dataset.role = 'letter';
                node.appendChild(t);
            }
        }

        function ensureCharNode(id, type, isMe, isBot) {
            let node = document.getElementById('char-' + id);
            if (!node) {
                node = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                node.setAttribute('id', 'char-' + id);
                node.dataset.type = type;
                renderCharContent(node, type, isMe, isBot);
                charsGroup.appendChild(node);
            } else if (node.dataset.type !== type) {
                // Type changed (e.g. team reassigned) - re-render content
                node.dataset.type = type;
                renderCharContent(node, type, isMe, isBot);
            }
            return node;
        }

        function positionCharNode(node, cx, cy, scale, opacity) {
            // cx, cy are pixel center coords. scale and opacity are optional.
            const child = node.firstChild;
            if (!child) return;
            const s = (scale == null) ? 1 : scale;
            if (child.dataset.role === 'icon') {
                const sizePx = CHAR_SIZE_CELLS * CELL;
                child.setAttribute('x', cx - sizePx / 2);
                child.setAttribute('y', cy - sizePx / 2);
            } else {
                child.setAttribute('x', cx);
                child.setAttribute('y', cy);
            }
            // Scale around the center via transform (works for both text and image).
            if (s !== 1) {
                node.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
            } else {
                node.removeAttribute('transform');
            }
            if (opacity != null && child) child.style.opacity = opacity;
        }
        function renderPlayers() {
            const now = Date.now();
            const seen = new Set();
            const renderList = {};
            for (const id in allPlayers) {
                const p = allPlayers[id];
                if (!p || !p.type) continue;
                if ((now - (p.lastSeen || 0)) > STALE_MS) continue;
                renderList[id] = { ...p, _bot: false };
            }
            if (myType) {
                renderList[myId] = {
                    ...(renderList[myId] || {}),
                    type: myType,
                    x: myVisualX,
                    y: myVisualY,
                    active: isPlaying,
                    _bot: false
                };
            }
            // Render all bots
            for (const bid in bots) {
                const b = bots[bid];
                if (!b || !b.type) continue;
                renderList['bot-' + bid] = {
                    type: b.type,
                    x: b.x,
                    y: b.y,
                    active: true,
                    spawnedAt: b.spawnedAt,
                    _bot: true
                };
            }

            // Friction blend: every render frame, displayed position moves a fraction
            // of the way toward the target. FRICTION=0.35 means each frame keeps 35%
            // of the old position and absorbs 65% of the new — clearly visible drag,
            // still responsive. Comment-correct now :)
            const blend = 1 - FRICTION;

            for (const id in renderList) {
                const p = renderList[id];
                const isMe = id === myId;
                seen.add(id);
                let v = visualPos[id];
                if (!v) v = visualPos[id] = { x: p.x, y: p.y };
                v.x += (p.x - v.x) * blend;
                v.y += (p.y - v.y) * blend;

                const node = ensureCharNode(id, p.type, isMe, p._bot);
                const px = (v.x + 0.5) * CELL;
                const py = (v.y + 0.5) * CELL;
                // Compute opacity: inactive = dim; in grace window = pulsing
                let op = p.active ? 1 : 0.35;
                const graceSrc = isMe ? respawnedAt : (p.spawnedAt || 0);
                const sinceSpawn = now - graceSrc;
                if (graceSrc && sinceSpawn < RESPAWN_GRACE_MS) {
                    // Pulse 0.3 ↔ 0.9 at ~4Hz so it reads as "invulnerable"
                    op = 0.6 + 0.3 * Math.sin(sinceSpawn / 1000 * Math.PI * 4);
                }
                positionCharNode(node, px, py, 1, op);
            }

            charsGroup.querySelectorAll('g').forEach(n => {
                const id = n.id.replace('char-', '');
                if (id.startsWith('death-')) return; // handled by death pass
                if (!seen.has(id)) { n.remove(); delete visualPos[id]; }
            });

            // ===== Death animations pass =====
            // For each dying char, draw it scaling 1→2 and fading 1→0 over SCORE_ANIM_MS.
            for (const animId in dyingChars) {
                const d = dyingChars[animId];
                const t = (now - d.startedAt) / SCORE_ANIM_MS;
                if (t >= 1) {
                    const dn = document.getElementById('death-' + animId);
                    if (dn) dn.remove();
                    delete dyingChars[animId];
                    continue;
                }
                let dn = document.getElementById('death-' + animId);
                if (!dn) {
                    dn = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    dn.setAttribute('id', 'death-' + animId);
                    dn.dataset.type = d.type;
                    renderCharContent(dn, d.type, d.isMe, d.isBot);
                    charsGroup.appendChild(dn);
                }
                // Ease-out cubic for the scale/fade — finishes quickly, lingers near end
                const eased = 1 - Math.pow(1 - t, 3);
                const scale = 1 + eased;       // 1 → 2 (200%)
                const opacity = 1 - eased;     // 1 → 0
                const px = (d.x + 0.5) * CELL;
                const py = (d.y + 0.5) * CELL;
                positionCharNode(dn, px, py, scale, opacity);
            }

            requestAnimationFrame(renderPlayers);
        }
        requestAnimationFrame(renderPlayers);

        // ===== Audio =====
        // Off by default. Click the speaker icon to enable. Pref is session-only
        // (no cookies / localStorage). To use real audio files, drop them at
        // these paths and the synthesized fallback will be skipped automatically.
        const SOUND_PATHS = {
            join: null,    // e.g. 'sounds/join.wav'
            got_R: null,   // rock crunch — e.g. 'sounds/rock.wav'
            got_P: null,   // paper crumple — e.g. 'sounds/paper.wav'
            got_S: null    // scissors swish — e.g. 'sounds/scissors.wav'
        };
        let soundOn = false;
        let audioCtx = null;
        const soundBuffers = {}; // path → AudioBuffer (decoded files)

        function ensureAudioCtx() {
            if (audioCtx) return audioCtx;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
            } catch (e) {
                audioCtx = null;
            }
            return audioCtx;
        }

        async function loadSoundFile(path) {
            if (!path || soundBuffers[path]) return;
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            try {
                const res = await fetch(path);
                const arr = await res.arrayBuffer();
                const buf = await ctx.decodeAudioData(arr);
                soundBuffers[path] = buf;
            } catch (e) {
                console.warn('Sound load failed:', path, e);
            }
        }

        function playBuffer(buf) {
            const ctx = ensureAudioCtx();
            if (!ctx || !buf) return;
            const src = ctx.createBufferSource();
            src.buffer = buf;
            src.connect(ctx.destination);
            src.start();
        }

        // ===== Synthesized fallbacks (used when SOUND_PATHS entry is null) =====
        function synthBoop() {
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(440, t0);
            o.frequency.exponentialRampToValueAtTime(880, t0 + 0.12);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
            o.connect(g).connect(ctx.destination);
            o.start(t0);
            o.stop(t0 + 0.2);
        }

        function synthRockCrunch() {
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const dur = 0.18;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                const env = Math.pow(1 - i / data.length, 2);
                data[i] = (Math.random() * 2 - 1) * env;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 600;
            const g = ctx.createGain();
            g.gain.value = 0.4;
            src.connect(filter).connect(g).connect(ctx.destination);
            src.start(t0);
        }

        function synthPaperCrumple() {
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const dur = 0.22;
            const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) {
                const env = (Math.sin(i / data.length * Math.PI * 3) ** 2) * (1 - i / data.length);
                data[i] = (Math.random() * 2 - 1) * env;
            }
            const src = ctx.createBufferSource();
            src.buffer = buf;
            const filter = ctx.createBiquadFilter();
            filter.type = 'highpass';
            filter.frequency.value = 2500;
            const g = ctx.createGain();
            g.gain.value = 0.25;
            src.connect(filter).connect(g).connect(ctx.destination);
            src.start(t0);
        }

        function synthScissorsSwish() {
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            const t0 = ctx.currentTime;
            const makeChirp = (start, f1, f2) => {
                const o = ctx.createOscillator();
                const g = ctx.createGain();
                o.type = 'triangle';
                o.frequency.setValueAtTime(f1, start);
                o.frequency.exponentialRampToValueAtTime(f2, start + 0.06);
                g.gain.setValueAtTime(0.0001, start);
                g.gain.exponentialRampToValueAtTime(0.2, start + 0.005);
                g.gain.exponentialRampToValueAtTime(0.0001, start + 0.07);
                o.connect(g).connect(ctx.destination);
                o.start(start);
                o.stop(start + 0.08);
            };
            makeChirp(t0, 2200, 3200);
            makeChirp(t0 + 0.05, 2600, 1800);
        }

        const SYNTH = {
            join: synthBoop,
            got_R: synthRockCrunch,
            got_P: synthPaperCrumple,
            got_S: synthScissorsSwish
        };

        function pulseSoundIcon() {
            // Re-trigger the CSS animation by removing and re-adding the class.
            // Force reflow between toggles or successive triggers would no-op.
            soundToggle.classList.remove('pulse');
            // Reading offsetWidth forces a layout flush, which restarts the animation.
            void soundToggle.offsetWidth;
            soundToggle.classList.add('pulse');
        }
        // Clean up the pulse class after the animation ends so the hover state
        // and 'on' color return to normal.
        document.addEventListener('animationend', (e) => {
            if (e.target && e.target.id === 'sound-toggle') {
                e.target.classList.remove('pulse');
            }
        });

        function playSound(name) {
            // If sound is off, just give a visual nudge that something happened.
            if (!soundOn) {
                pulseSoundIcon();
                return;
            }
            const ctx = ensureAudioCtx();
            // Background tabs can have a suspended AudioContext (especially
            // mobile Chrome). Try to resume it on-demand. resume() returns a
            // promise; if the gesture-credit has expired (rare), the call is
            // a no-op and the sound is silently dropped.
            if (ctx && ctx.state === 'suspended') {
                ctx.resume().catch(() => {});
            }
            const path = SOUND_PATHS[name];
            if (path && soundBuffers[path]) {
                playBuffer(soundBuffers[path]);
            } else if (SYNTH[name]) {
                SYNTH[name]();
            }
        }

        // Resume audio context whenever the tab becomes visible again — covers
        // the case where the browser suspended it while the tab was hidden.
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        });

        // ===== Sound toggle UI =====
        const soundToggle = document.getElementById('sound-toggle');
        const soundX1 = document.getElementById('sound-x1');
        const soundX2 = document.getElementById('sound-x2');
        const soundWave1 = document.getElementById('sound-wave1');
        const soundWave2 = document.getElementById('sound-wave2');

        function updateSoundIcon() {
            soundToggle.classList.toggle('on', soundOn);
            if (soundOn) {
                soundX1.style.display = 'none';
                soundX2.style.display = 'none';
                soundWave1.style.display = '';
                soundWave2.style.display = '';
                soundToggle.title = 'Sound on — click to mute';
            } else {
                soundX1.style.display = '';
                soundX2.style.display = '';
                soundWave1.style.display = 'none';
                soundWave2.style.display = 'none';
                soundToggle.title = 'Sound off — click to enable';
            }
        }
        updateSoundIcon();

        soundToggle.addEventListener('click', () => {
            soundOn = !soundOn;
            updateSoundIcon();
            if (soundOn) {
                // Autoplay policy: must create/resume AudioContext from a user gesture.
                const ctx = ensureAudioCtx();
                if (ctx && ctx.state === 'suspended') ctx.resume();
                // Preload any file-based sounds so they're ready when events fire.
                Object.values(SOUND_PATHS).forEach(p => { if (p) loadSoundFile(p); });
                // Confirmation boop so the user knows it worked.
                playSound('join');
            }
        });

        // ===== Sound: player joined =====
        // Suppress the first 1.5s so we don't beep for existing players when we connect.
        let joinSoundArmed = false;
        setTimeout(() => { joinSoundArmed = true; }, 1500);
        const knownPlayerIds = new Set();

        // ===== Title flash when backgrounded =====
        // When the tab isn't visible and someone joins, flash the tab title so
        // the user notices in their tab strip. Clears when they refocus.
        const ORIGINAL_TITLE = document.title;
        let titleFlashTimer = null;
        let pendingJoiners = 0;

        function flashTitle() {
            if (!document.hidden) return;
            pendingJoiners++;
            updateFlashedTitle();
            // Toggle between original and notice every 1s for max ~10s
            if (titleFlashTimer) return;
            let toggle = false;
            titleFlashTimer = setInterval(() => {
                if (!document.hidden) {
                    stopTitleFlash();
                    return;
                }
                toggle = !toggle;
                document.title = toggle ? ORIGINAL_TITLE : flashedLabel();
            }, 1000);
            // Stop after 30s even if not refocused
            setTimeout(stopTitleFlash, 30000);
        }
        function flashedLabel() {
            return pendingJoiners === 1
                ? '👋 someone joined — rps'
                : `👋 ${pendingJoiners} joined — rps`;
        }
        function updateFlashedTitle() {
            if (document.hidden) document.title = flashedLabel();
        }
        function stopTitleFlash() {
            if (titleFlashTimer) { clearInterval(titleFlashTimer); titleFlashTimer = null; }
            document.title = ORIGINAL_TITLE;
            pendingJoiners = 0;
        }
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) stopTitleFlash();
        });

        playersRef.on('child_added', (snap) => {
            const id = snap.key;
            if (knownPlayerIds.has(id)) return;
            knownPlayerIds.add(id);
            if (!joinSoundArmed) return;
            if (id === myId) return; // don't beep at ourselves
            playSound('join');
            if (document.hidden) flashTitle();
        });
        playersRef.on('child_removed', (snap) => {
            knownPlayerIds.delete(snap.key);
        });

        setInterval(() => {
            if (myType) playerRef.update({ lastSeen: Date.now() });
        }, 4000);
    </script>
</body>
</html>
